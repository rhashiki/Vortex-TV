plugins { id 'com.android.application' }

android {
    namespace 'os.vortex.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'os.vortex.tv'
        minSdk 25
        targetSdk 28
        versionCode 26
        versionName '0.2.6-youtube-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview26'
            manifestPlaceholders = [appLabel: 'Vortex TV YouTube Teste']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: 'Vortex TV']
        }
    }
}

dependencies {
    def media3Version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "com.github.bumptech.glide:glide:4.16.0"
}
